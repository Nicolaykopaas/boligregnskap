<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boligregnskap</title>
    <style>
        :root {
            --ink: #1a1d24;
            --paper: #f7f6f2;
            --panel: #ffffff;
            --line: #e3e1da;
            --muted: #6b6f78;
            --income: #1f7a4d;
            --expense: #b23a3a;
            --accent: #2d4a63;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.5;
        }

        .app-layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #1b222c;
            color: #c3cbd6;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            padding: 18px 20px;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 10px 0; }
        .nav-item {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: inherit;
            padding: 9px 20px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
        .nav-item.active { background: var(--accent); color: #fff; font-weight: 500; }
        .nav-section-label {
            padding: 16px 20px 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #75808f;
        }
        .nav-item.nav-add { color: #9fb3c8; }

        .main-content { flex: 1; min-width: 0; }

        header {
            background: var(--accent);
            color: #fff;
            padding: 24px 32px;
        }
        header h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.3px; }
        header p { font-size: 13px; opacity: 0.75; margin-top: 2px; }

        .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 32px; }

        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 16px 18px;
        }
        .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .card .value { font-size: 24px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .value.pos { color: var(--income); }
        .value.neg { color: var(--expense); }

        h2 { font-size: 15px; font-weight: 600; margin: 24px 0 12px; color: var(--accent); }

        form.add {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
            margin-bottom: 28px;
        }
        form.add label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
        form.add input, form.add select {
            width: 100%;
            padding: 8px 9px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: #24405a; }
        button.ghost { background: transparent; color: var(--expense); padding: 4px 8px; }
        button.ghost:hover { background: #f5e9e9; }
        button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
        button.secondary:hover { background: #f2f4f6; }

        table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
        th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line); }
        th { background: #fafaf8; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
        tr:last-child td { border-bottom: none; }
        td.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
        .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
        .tag.INNTEKT { background: #e4f2ea; color: var(--income); }
        .tag.UTGIFT { background: #f6e6e6; color: var(--expense); }

        .empty { padding: 28px; text-align: center; color: var(--muted); font-size: 13px; }

        form.eiendom-form {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        form.eiendom-form label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
        form.eiendom-form input, form.eiendom-form select {
            width: 100%;
            padding: 8px 9px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }
        form.eiendom-form .full { grid-column: 1 / -1; }
        form.eiendom-form .actions { grid-column: 1 / -1; display: flex; gap: 8px; }

        .eiendom-detail {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 16px 18px;
            margin-bottom: 28px;
        }
        .eiendom-detail .rad { display: flex; gap: 8px; flex-wrap: wrap; }
        .estimat { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
        .estimat-tall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; }
        .estimat-tall .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .estimat-tall .value { font-size: 18px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .forbehold { font-size: 12px; color: var(--muted); margin-top: 10px; font-style: italic; }

        @media (max-width: 780px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; align-items: center; }
            .sidebar-brand { border-bottom: none; border-right: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }
            .sidebar-nav { display: flex; overflow-x: auto; padding: 0; }
            .nav-section-label { display: none; }
            .nav-item { padding: 12px 14px; }
            .cards { grid-template-columns: repeat(2, 1fr); }
            form.add { grid-template-columns: 1fr 1fr; }
            form.eiendom-form { grid-template-columns: 1fr 1fr; }
            .estimat-tall { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">Boligregnskap</div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header>
                <h1 id="header-title">Oversikt</h1>
                <p id="header-sub">Samlet oversikt over alle eiendommer</p>
            </header>

            <div class="wrap">
                <form class="eiendom-form" id="eiendom-form" style="display:none">
                    <div class="full">
                        <label>Adresse</label>
                        <input id="e-adresse" placeholder="f.eks. Kongens gate 1, Oslo" required>
                    </div>
                    <div>
                        <label>Boligtype</label>
                        <select id="e-boligtype">
                            <option value="LEILIGHET">Leilighet</option>
                            <option value="ENEBOLIG">Enebolig</option>
                            <option value="REKKEHUS">Rekkehus</option>
                            <option value="TOMANNSBOLIG">Tomannsbolig</option>
                            <option value="HYBEL">Hybel</option>
                            <option value="ANNET">Annet</option>
                        </select>
                    </div>
                    <div>
                        <label>Areal (m²)</label>
                        <input id="e-areal" type="number" step="0.1" placeholder="0" required>
                    </div>
                    <div>
                        <label>Antall rom</label>
                        <input id="e-rom" type="number" step="1" placeholder="0" required>
                    </div>
                    <div>
                        <label>Antall soverom</label>
                        <input id="e-soverom" type="number" step="1">
                    </div>
                    <div>
                        <label>Byggeår</label>
                        <input id="e-byggeaar" type="number" step="1">
                    </div>
                    <div>
                        <label>Felleskostnader/mnd (kr)</label>
                        <input id="e-felleskost" type="number" step="0.01">
                    </div>
                    <div>
                        <label>Prisantydning (kr)</label>
                        <input id="e-prisantydning" type="number" step="0.01">
                    </div>
                    <div class="full">
                        <label>Notat</label>
                        <input id="e-notat" placeholder="valgfritt">
                    </div>
                    <div class="actions">
                        <button type="submit">Lagre eiendom</button>
                        <button type="button" class="secondary" id="btn-avbryt-eiendom">Avbryt</button>
                    </div>
                </form>

                <div class="eiendom-detail" id="eiendom-detail" style="display:none">
                    <div class="rad">
                        <button type="button" id="btn-leieestimat">Beregn forventet leieinntekt</button>
                        <button type="button" class="ghost" id="btn-slett-eiendom">Slett eiendom</button>
                    </div>
                    <div class="estimat" id="ed-estimat" style="display:none"></div>
                </div>

                <div class="cards">
                    <div class="card"><div class="label">Inntekter i år</div><div class="value pos" id="c-income">–</div></div>
                    <div class="card"><div class="label">Utgifter i år</div><div class="value neg" id="c-expenses">–</div></div>
                    <div class="card"><div class="label">Overskudd</div><div class="value" id="c-profit">–</div></div>
                    <div class="card"><div class="label">Estimert skatt</div><div class="value" id="c-tax">–</div></div>
                </div>

                <div id="add-form-wrap" style="display:none">
                    <h2>Ny transaksjon</h2>
                    <form class="add" id="add-form">
                        <div>
                            <label>Type</label>
                            <select id="f-type">
                                <option value="INNTEKT">Inntekt</option>
                                <option value="UTGIFT">Utgift</option>
                            </select>
                        </div>
                        <div>
                            <label>Kategori</label>
                            <input id="f-category" placeholder="f.eks. Leie, Vedlikehold" required>
                        </div>
                        <div>
                            <label>Beløp (kr)</label>
                            <input id="f-amount" type="number" step="0.01" placeholder="0" required>
                        </div>
                        <div>
                            <label>Dato</label>
                            <input id="f-date" type="date" required>
                        </div>
                        <div>
                            <label>Forfall (valgfritt)</label>
                            <input id="f-due" type="date">
                        </div>
                        <button type="submit">Legg til</button>
                    </form>
                </div>
                <div id="add-form-hint" class="empty" style="display:none"></div>

                <h2>Kommende forfall</h2>
                <div id="upcoming"></div>

                <h2>Alle transaksjoner</h2>
                <table>
                    <thead>
                        <tr><th>Dato</th><th>Type</th><th>Kategori</th><th style="text-align:right">Beløp</th><th></th></tr>
                    </thead>
                    <tbody id="tx-body"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const kr = n => Number(n).toLocaleString('no-NO', { style: 'currency', currency: 'NOK', maximumFractionDigits: 0 });
        const year = new Date().getFullYear();

        document.getElementById('f-date').valueAsDate = new Date();

        let eiendommer = [];
        let currentView = localStorage.getItem('currentView') || 'oversikt'; // 'oversikt' eller en eiendom-id

        const boligtypeNavn = {
            LEILIGHET: 'Leilighet', ENEBOLIG: 'Enebolig', REKKEHUS: 'Rekkehus',
            TOMANNSBOLIG: 'Tomannsbolig', HYBEL: 'Hybel', ANNET: 'Annet'
        };

        function eiendomIdQuery() {
            return currentView !== 'oversikt' ? `?eiendomId=${currentView}` : '';
        }

        function valgtEiendom() {
            return eiendommer.find(e => String(e.id) === currentView);
        }

        async function loadEiendommer() {
            const r = await fetch('/api/eiendommer');
            eiendommer = await r.json();
            if (currentView !== 'oversikt' && !eiendommer.some(e => String(e.id) === currentView)) {
                currentView = 'oversikt';
            }
            localStorage.setItem('currentView', currentView);
            renderSidebar();
            render();
            await refresh();
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            let html = `<button type="button" class="nav-item ${currentView === 'oversikt' ? 'active' : ''}" data-view="oversikt">Oversikt</button>`;
            if (eiendommer.length) {
                html += `<div class="nav-section-label">Eiendommer</div>`;
                html += eiendommer.map(e =>
                    `<button type="button" class="nav-item ${String(e.id) === currentView ? 'active' : ''}" data-view="${e.id}">${e.adresse}</button>`
                ).join('');
            }
            html += `<button type="button" class="nav-item nav-add" data-view="ny">+ Ny eiendom</button>`;
            nav.innerHTML = html;

            nav.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.dataset.view;
                    if (view === 'ny') {
                        document.getElementById('eiendom-form').style.display = 'grid';
                        return;
                    }
                    currentView = view;
                    localStorage.setItem('currentView', currentView);
                    document.getElementById('eiendom-form').style.display = 'none';
                    renderSidebar();
                    render();
                    refresh();
                });
            });
        }

        function render() {
            const detail = document.getElementById('eiendom-detail');
            const title = document.getElementById('header-title');
            const sub = document.getElementById('header-sub');
            const addFormWrap = document.getElementById('add-form-wrap');
            const addFormHint = document.getElementById('add-form-hint');

            document.getElementById('ed-estimat').style.display = 'none';

            if (currentView === 'oversikt') {
                detail.style.display = 'none';
                title.textContent = 'Oversikt';
                sub.textContent = 'Samlet oversikt over alle eiendommer';
                addFormWrap.style.display = 'none';
                addFormHint.style.display = 'block';
                addFormHint.textContent = eiendommer.length
                    ? 'Velg en eiendom i menyen til venstre for å legge til en transaksjon.'
                    : 'Opprett din første eiendom i menyen til venstre for å komme i gang.';
                return;
            }

            const e = valgtEiendom();
            if (!e) {
                currentView = 'oversikt';
                render();
                return;
            }

            detail.style.display = 'block';
            title.textContent = e.adresse;
            const metaDeler = [
                boligtypeNavn[e.boligtype] || '',
                e.arealKvm ? `${e.arealKvm} m²` : '',
                e.antallRom ? `${e.antallRom} rom` : '',
                e.poststed ? `${e.postnummer || ''} ${e.poststed}`.trim() : (e.kommune ? e.kommune : 'Adresse ikke gjenkjent')
            ].filter(Boolean);
            sub.textContent = metaDeler.join(' · ');
            addFormWrap.style.display = 'block';
            addFormHint.style.display = 'none';
        }

        document.getElementById('btn-avbryt-eiendom').addEventListener('click', () => {
            document.getElementById('eiendom-form').style.display = 'none';
        });

        document.getElementById('eiendom-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const eiendom = {
                adresse: document.getElementById('e-adresse').value,
                boligtype: document.getElementById('e-boligtype').value,
                arealKvm: document.getElementById('e-areal').value,
                antallRom: document.getElementById('e-rom').value,
                antallSoverom: document.getElementById('e-soverom').value || null,
                byggeaar: document.getElementById('e-byggeaar').value || null,
                felleskostnaderPerMaaned: document.getElementById('e-felleskost').value || null,
                prisantydning: document.getElementById('e-prisantydning').value || null,
                notat: document.getElementById('e-notat').value || null
            };
            const r = await fetch('/api/eiendommer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(eiendom)
            });
            const nyEiendom = await r.json();
            e.target.reset();
            e.target.style.display = 'none';
            currentView = String(nyEiendom.id);
            await loadEiendommer();
        });

        document.getElementById('btn-slett-eiendom').addEventListener('click', async () => {
            const e = valgtEiendom();
            if (!e) return;
            if (!confirm(`Slette eiendommen "${e.adresse}"? Dette går ikke an hvis den har transaksjoner.`)) return;
            const r = await fetch(`/api/eiendommer/${e.id}`, { method: 'DELETE' });
            if (r.status === 409) {
                alert('Kan ikke slette - eiendommen har transaksjoner. Slett transaksjonene først.');
                return;
            }
            currentView = 'oversikt';
            await loadEiendommer();
        });

        document.getElementById('btn-leieestimat').addEventListener('click', async () => {
            const e = valgtEiendom();
            if (!e) return;
            const box = document.getElementById('ed-estimat');
            box.style.display = 'block';
            box.innerHTML = '<div class="empty" style="padding:8px">Beregner...</div>';
            const r = await fetch(`/api/eiendommer/${e.id}/leieestimat`);
            const d = await r.json();
            if (!r.ok) {
                box.innerHTML = `<div class="empty" style="padding:8px">${d.feil || 'Kunne ikke beregne leieestimat.'}</div>`;
                return;
            }
            box.innerHTML = `
                <div class="estimat-tall">
                    <div><div class="label">Brutto leie/mnd</div><div class="value">${kr(d.bruttoManedligLeie)}</div></div>
                    <div><div class="label">Netto leie/mnd</div><div class="value pos">${kr(d.nettoManedligLeie)}</div></div>
                    <div><div class="label">Brutto leie/år</div><div class="value">${kr(d.bruttoAarligLeie)}</div></div>
                    <div><div class="label">Netto leie/år</div><div class="value pos">${kr(d.nettoAarligLeie)}</div></div>
                </div>
                <div class="forbehold">${d.forbehold}</div>`;
        });

        async function loadReport() {
            const r = await fetch(`/api/transactions/report/${year}${eiendomIdQuery()}`);
            const d = await r.json();
            document.getElementById('c-income').textContent = kr(d.income);
            document.getElementById('c-expenses').textContent = kr(d.expenses);
            const profit = document.getElementById('c-profit');
            profit.textContent = kr(d.profit);
            profit.className = 'value ' + (Number(d.profit) >= 0 ? 'pos' : 'neg');
            document.getElementById('c-tax').textContent = kr(d.estimatedTax);
        }

        async function loadTransactions() {
            const r = await fetch(`/api/transactions${eiendomIdQuery()}`);
            const list = await r.json();
            const body = document.getElementById('tx-body');
            if (!list.length) {
                body.innerHTML = `<tr><td colspan="5" class="empty">${
                    currentView === 'oversikt'
                        ? 'Ingen transaksjoner registrert på noen eiendom ennå.'
                        : 'Ingen transaksjoner ennå. Legg til den første over.'
                }</td></tr>`;
                return;
            }
            body.innerHTML = list.map(t => `
                <tr>
                    <td>${t.date}</td>
                    <td><span class="tag ${t.type}">${t.type === 'INNTEKT' ? 'Inntekt' : 'Utgift'}</span></td>
                    <td>${t.category}${t.note ? ' · ' + t.note : ''}</td>
                    <td class="amount">${t.type === 'UTGIFT' ? '−' : ''}${kr(t.amount)}</td>
                    <td style="text-align:right"><button class="ghost" onclick="del(${t.id})">Slett</button></td>
                </tr>`).join('');
        }

        async function loadUpcoming() {
            const r = await fetch(`/api/transactions/upcoming${eiendomIdQuery()}`);
            const list = await r.json();
            const el = document.getElementById('upcoming');
            if (!list.length) {
                el.innerHTML = '<div class="card"><div class="empty" style="padding:8px">Ingen kommende forfall registrert.</div></div>';
                return;
            }
            el.innerHTML = '<table><tbody>' + list.map(t => `
                <tr><td>${t.dueDate}</td><td>${t.category}</td><td class="amount">${kr(t.amount)}</td></tr>
            `).join('') + '</tbody></table>';
        }

        async function refresh() {
            await Promise.all([loadReport(), loadTransactions(), loadUpcoming()]);
        }

        window.del = async function(id) {
            await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
            refresh();
        };

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (currentView === 'oversikt') return;
            const tx = {
                type: document.getElementById('f-type').value,
                category: document.getElementById('f-category').value,
                amount: document.getElementById('f-amount').value,
                date: document.getElementById('f-date').value,
                dueDate: document.getElementById('f-due').value || null
            };
            await fetch(`/api/transactions?eiendomId=${currentView}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(tx)
            });
            e.target.reset();
            document.getElementById('f-date').valueAsDate = new Date();
            refresh();
        });

        loadEiendommer();
    </script>
</body>
</html>
